    description: leaf-2a_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 210
        vni: 10210
      - id: 220
        vni: 10220
      - id: 1000
        vni: 11000
      vrfs:
      - name: OVERLAY
        vni: 10
