aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
banners:
  motd: 'You shall not pass. Unless you are authorized. Then you shall pass.

    EOF

    '
config_end: true
daemon_terminattr:
  cvaddrs:
  - 192.168.0.5:9910
  cvauth:
    method: token
    token_file: /tmp/token
  cvsourceintf: Management0
  cvvrf: default
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
dns_domain: atd.lab
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1/1
  description: P2P_spine-1_Ethernet4
  shutdown: false
  mtu: 1500
  ip_address: 172.16.1.9/31
  metadata:
    peer: spine-1
    peer_interface: Ethernet4
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2/1
  description: P2P_spine-2_Ethernet4
  shutdown: false
  mtu: 1500
  ip_address: 172.16.1.11/31
  metadata:
    peer: spine-2
    peer_interface: Ethernet4
    peer_type: spine
  switchport:
    enabled: false
hostname: leaf-2a
ip_domain_lookup:
  source_interfaces:
  - name: Management0
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: default
    servers:
    - ip_address: 192.168.0.1
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
local_users:
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$7c02c6305e03f2fc$XsDXCGgjBsRE1pPLPOuPPVNiLE2h3K2Z.eriQynDKW4PuFTs.VOhqqnLfik9yZY1c68AyUa2/UCYtKWcRp0FR/
  ssh_key: ssh-rsa 
    arista@avd-workshop-campus-1-c644c9e8-eos
logging:
  vrfs:
  - name: default
    source_interface: Management0
    hosts:
    - name: 10.200.0.108
      protocol: udp
    - name: 10.200.1.108
      protocol: udp
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.250.1.5/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.255.255.5/32
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.16/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: cEOS
  fabric_name: CAMPUS_A_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_network_type
      value: campusV2
    - name: topology_hint_type
      value: Leaf
    - name: Role
      value: Leaf
    - name: Campus
      value: Cleveland
    - name: Campus-Pod
      value: Campus A
    - name: Access-Pod
      value: IDF2
    interface_tags:
    - interface: Ethernet1/1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Uplink
    - interface: Ethernet2/1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Uplink
    - interface: Management0
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Management
ntp:
  local_interface:
    name: Management0
    vrf: default
  servers:
  - name: 192.168.0.1
    iburst: true
    preferred: true
  vrf: default
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.250.1.0/24 eq 32
  - sequence: 20
    action: permit 10.255.255.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65102'
  router_id: 10.250.1.5
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 172.16.1.8
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: spine-1
    description: spine-1_Ethernet4
  - ip_address: 172.16.1.10
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: spine-2
    description: spine-2_Ethernet4
  - ip_address: 10.1.252.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: spine-1
    description: spine-1_Loopback0
  - ip_address: 10.1.252.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: spine-2
    description: spine-2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 210
    metadata:
      tenants:
      - CAMPUS_A
    rd: 10.250.1.5:10210
    route_targets:
      both:
      - 10210:10210
    redistribute_routes:
    - learned
  - id: 220
    metadata:
      tenants:
      - CAMPUS_A
    rd: 10.250.1.5:10220
    route_targets:
      both:
      - 10220:10220
    redistribute_routes:
    - learned
  - id: 1000
    metadata:
      tenants:
      - CAMPUS_A
    rd: 10.250.1.5:11000
    route_targets:
      both:
      - 11000:11000
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: OVERLAY
    rd: 10.250.1.5:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.250.1.5
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan210
  description: IDF2_DATA
  shutdown: false
  vrf: OVERLAY
  ip_address_virtual: 10.2.10.1/24
  metadata:
    tenants:
    - CAMPUS_A
    tags:
    - IDF2_DATA
- name: Vlan220
  description: IDF2_VOICE
  shutdown: false
  vrf: OVERLAY
  ip_address_virtual: 10.2.20.1/24
  metadata:
    tenants:
    - CAMPUS_A
    tags:
    - IDF2_VOICE
- name: Vlan1000
  description: SECURITY
  shutdown: false
  vrf: OVERLAY
  ip_address_virtual: 10.100.100.1/24
  metadata:
    tenants:
    - CAMPUS_A
    tags:
    - IDF1_DATA
    - IDF2_DATA
    - IDF3_DATA
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 210
  name: IDF2_DATA
  metadata:
    tenants:
    - CAMPUS_A
- id: 220
  name: IDF2_VOICE
  metadata:
    tenants:
    - CAMPUS_A
- id: 1000
  name: SECURITY
  metadata:
    tenants:
    - CAMPUS_A
vrfs:
- name: default
  ip_routing: false
- name: OVERLAY
  ip_routing: true
  metadata:
    tenants:
    - CAMPUS_A
vxlan_interface:
