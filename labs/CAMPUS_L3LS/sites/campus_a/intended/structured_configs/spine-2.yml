aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
config_end: true
daemon_terminattr:
  cvaddrs:
  - 192.168.0.5:9910
  cvauth:
    method: token
    token_file: /tmp/token
  cvsourceintf: Management0
  cvvrf: default
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
dns_domain: atd.lab
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: P2P_leaf-1b_Ethernet49
  shutdown: false
  mtu: 1500
  ip_address: 172.16.1.2/31
  metadata:
    peer: leaf-1b
    peer_interface: Ethernet49
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet4
  description: P2P_leaf-2a_Ethernet2/1
  shutdown: false
  mtu: 1500
  ip_address: 172.16.1.10/31
  metadata:
    peer: leaf-2a
    peer_interface: Ethernet2/1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet5
  description: P2P_leaf-3a_Ethernet50
  shutdown: false
  mtu: 1500
  ip_address: 172.16.1.14/31
  metadata:
    peer: leaf-3a
    peer_interface: Ethernet50
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet6
  description: P2P_leaf-3b_Ethernet50
  shutdown: false
  mtu: 1500
  ip_address: 172.16.1.18/31
  metadata:
    peer: leaf-3b
    peer_interface: Ethernet50
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: spine-2
ip_domain_lookup:
  source_interfaces:
  - name: Management0
ip_name_server:
  vrfs:
  - name: default
    servers:
    - ip_address: 192.168.0.1
ip_routing: true
local_users:
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$48edc85089a898cd$bR3S7ZmtzQEcQtzpVtY2z.ANm3XSD1xFzlCmIvUQdWf3G6u8sUM9Hz462egKSCa.8Jq8lwicMK1wSvXmrhJOu/
  ssh_key: ssh-rsa 
    arista@avd-workshop-campus-1-c644c9e8-eos
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.1.252.2/32
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.13/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: cEOS
  fabric_name: CAMPUS_A_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_network_type
      value: campusV2
    - name: topology_hint_type
      value: Spine
    - name: Role
      value: Spine
    - name: Campus
      value: Cleveland
    - name: Campus-Pod
      value: Campus A
    interface_tags:
    - interface: Ethernet3
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Downlink
    - interface: Ethernet4
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Downlink
    - interface: Ethernet5
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Downlink
    - interface: Ethernet6
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Downlink
    - interface: Management0
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Management
ntp:
  local_interface:
    name: Management0
    vrf: default
  servers:
  - name: 192.168.0.1
    iburst: true
    preferred: true
  vrf: default
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.1.252.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 10.1.252.2
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 172.16.1.3
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: leaf-1b
    description: leaf-1b_Ethernet49
  - ip_address: 172.16.1.11
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: leaf-2a
    description: leaf-2a_Ethernet2/1
  - ip_address: 172.16.1.15
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65103'
    metadata:
      peer: leaf-3a
    description: leaf-3a_Ethernet50
  - ip_address: 172.16.1.19
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65103'
    metadata:
      peer: leaf-3b
    description: leaf-3b_Ethernet50
  - ip_address: 10.250.1.4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: leaf-1b
    description: leaf-1b_Loopback0
  - ip_address: 10.250.1.5
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: leaf-2a
    description: leaf-2a_Loopback0
  - ip_address: 10.250.1.6
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65103'
    metadata:
      peer: leaf-3a
    description: leaf-3a_Loopback0
  - ip_address: 10.250.1.7
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65103'
    metadata:
      peer: leaf-3b
    description: leaf-3b_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: default
  ip_routing: false
