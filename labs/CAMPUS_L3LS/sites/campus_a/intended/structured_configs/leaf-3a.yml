port_channel_interfaces:
- name: Port-Channel47
  description: MLAG_leaf-3b_Port-Channel47
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel51
  description: L2_member-leaf-3c_Port-Channel49
  shutdown: false
  mlag: 51
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: none
- name: Port-Channel52
  description: L2_member-leaf-3d_Port-Channel49
  shutdown: false
  mlag: 52
  switchport:
