!
no enable password
no aaa root
!
username arista privilege 15 role network-admin secret sha512 $6$aaa8731b20e71e1e$z.UA1nRqiJffrbQvVGVYnB0z53dZk9IDZl.M/H/L3.QZYlK0quewbK1E8.nSeo/p5whIL0ayTumNagN6uL4Sg.
username arista ssh-key ssh-rsa  arista@avd-workshop-campus-1-c644c9e8-eos
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=default -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -cvsourceintf=Management0
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
logging host 10.200.0.108
logging host 10.200.1.108
logging source-interface Management0
!
hostname leaf-1a
ip domain lookup source-interface Management0
ip name-server vrf default 192.168.0.1
dns domain atd.lab
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 32768
!
vlan 110
   name IDF1_DATA
!
vlan 120
   name IDF1_VOICE
!
vlan 1000
   name SECURITY
!
vlan 3009
   name MLAG_L3_VRF_OVERLAY
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance OVERLAY
!
banner motd
You shall not pass. Unless you are authorized. Then you shall pass.
EOF

!
aaa authorization exec default local
!
interface Port-Channel47
   description MLAG_leaf-1b_Port-Channel47
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet47
   description MLAG_leaf-1b_Ethernet47
   no shutdown
   channel-group 47 mode active
!
interface Ethernet48
   description MLAG_leaf-1b_Ethernet48
   no shutdown
   channel-group 47 mode active
!
interface Ethernet49
   description P2P_spine-1_Ethernet3
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.1.1/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.250.1.3/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.255.255.3/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.14/24
!
interface Vlan110
   description IDF1_DATA
   no shutdown
   vrf OVERLAY
   ip address virtual 10.1.10.1/24
!
interface Vlan120
   description IDF1_VOICE
   no shutdown
   vrf OVERLAY
   ip address virtual 10.1.20.1/24
!
interface Vlan1000
   description SECURITY
   no shutdown
   vrf OVERLAY
   ip address virtual 10.100.100.1/24
!
interface Vlan3009
   description MLAG_L3_VRF_OVERLAY
   no shutdown
   mtu 1500
   vrf OVERLAY
   ip address 10.252.1.0/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 1500
   ip address 10.252.1.0/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.253.1.0/31
!
interface Vxlan1
   description leaf-1a_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 110 vni 10110
   vxlan vlan 120 vni 10120
   vxlan vlan 1000 vni 11000
   vxlan vrf OVERLAY vni 10
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf OVERLAY
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.250.1.0/24 eq 32
   seq 20 permit 10.255.255.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.252.1.0/31
!
mlag configuration
   domain-id IDF1
   local-interface Vlan4094
   peer-address 10.253.1.1
   peer-link Port-Channel47
!
ip route 0.0.0.0/0 192.168.0.1
!
ntp local-interface Management0
ntp server 192.168.0.1 prefer iburst
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 10.250.1.3
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65101
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description leaf-1b
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.1.252.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.252.1 remote-as 65100
   neighbor 10.1.252.1 description spine-1_Loopback0
   neighbor 10.252.1.1 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.252.1.1 description leaf-1b_Vlan4093
   neighbor 172.16.1.0 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.1.0 remote-as 65100
   neighbor 172.16.1.0 description spine-1_Ethernet3
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 110
      rd 10.250.1.3:10110
      route-target both 10110:10110
      redistribute learned
   !
   vlan 120
      rd 10.250.1.3:10120
      route-target both 10120:10120
      redistribute learned
   !
   vlan 1000
      rd 10.250.1.3:11000
      route-target both 11000:11000
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf OVERLAY
      rd 10.250.1.3:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.250.1.3
      update wait-install
      neighbor 10.252.1.1 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.252.1.1 description leaf-1b_Vlan3009
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
