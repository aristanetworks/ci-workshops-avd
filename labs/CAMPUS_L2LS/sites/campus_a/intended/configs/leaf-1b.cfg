!
no enable password
no aaa root
!
username arista privilege 15 role network-admin secret sha512 $6$5fbc6c65ebd12c45$coNOPcixe.Em6UJGEu8.eTxHGa5Oh5jKU/ssRTyvneL3C7K8ZUxWMYuXMoCPIX6Y8Qz.lDjIuOcYLj2oLYakq/
username arista ssh-key ssh-rsa  arista@avd-workshop-campus-1-c644c9e8-eos
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=default -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -cvsourceintf=Management0
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname leaf-1b
ip domain lookup source-interface Management0
ip name-server vrf default 192.168.0.1
dns domain atd.lab
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 32768
!
vlan 110
   name IDF1_DATA
!
vlan 120
   name IDF1_VOICE
!
vlan 4094
   name MLAG
   trunk group MLAG
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel47
   description MLAG_leaf-1a_Port-Channel47
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel49
   description L2_CAMPUS_A_SPINES_Port-Channel3
   no shutdown
   switchport trunk allowed vlan 110,120
   switchport mode trunk
   switchport
   mlag 49
!
interface Ethernet47
   description MLAG_leaf-1a_Ethernet47
   no shutdown
   channel-group 47 mode active
!
interface Ethernet48
   description MLAG_leaf-1a_Ethernet48
   no shutdown
   channel-group 47 mode active
!
interface Ethernet49
   description L2_spine-2_Ethernet3
   no shutdown
   channel-group 49 mode active
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.15/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.1.253.1/31
!
mlag configuration
   domain-id IDF1
   local-interface Vlan4094
   peer-address 10.1.253.0
   peer-link Port-Channel47
!
ip route 0.0.0.0/0 192.168.0.1
!
ntp local-interface Management0
ntp server 192.168.0.1 prefer iburst
!
end
