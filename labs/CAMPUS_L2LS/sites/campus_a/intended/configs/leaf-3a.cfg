vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname leaf-3a
ip domain lookup source-interface Management0
ip name-server vrf default 192.168.0.1
dns domain atd.lab
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 32768
!
vlan 4094
   name MLAG
   trunk group MLAG
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel47
   description MLAG_leaf-3b_Port-Channel47
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel49
   description L2_CAMPUS_A_SPINES_Port-Channel5
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   mlag 49
!
interface Port-Channel51
   description L2_member-leaf-3c_Port-Channel49
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   mlag 51
!
interface Port-Channel52
   description L2_member-leaf-3d_Port-Channel49
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   mlag 52
!
interface Port-Channel531
   description L2_member-leaf-3e_Port-Channel49
   no shutdown
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   mlag 531
!
interface Ethernet47
   description MLAG_leaf-3b_Ethernet47
   no shutdown
   channel-group 47 mode active
!
interface Ethernet48
   description MLAG_leaf-3b_Ethernet48
   no shutdown
   channel-group 47 mode active
!
interface Ethernet49
   description L2_spine-1_Ethernet5
   no shutdown
   channel-group 49 mode active
!
interface Ethernet50
   description L2_spine-2_Ethernet5
   no shutdown
   channel-group 49 mode active
!
interface Ethernet51
   description L2_member-leaf-3c_Ethernet49
   no shutdown
   channel-group 51 mode active
!
interface Ethernet52
   description L2_member-leaf-3d_Ethernet49
   no shutdown
   channel-group 52 mode active
!
interface Ethernet53/1
   description L2_member-leaf-3e_Ethernet49
   no shutdown
   channel-group 531 mode active
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.17/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.1.253.0/31
!
mlag configuration
   domain-id IDF3
   local-interface Vlan4094
   peer-address 10.1.253.1
   peer-link Port-Channel47
!
ip route 0.0.0.0/0 192.168.0.1
!
ntp local-interface Management0
ntp server 192.168.0.1 prefer iburst
!
end
