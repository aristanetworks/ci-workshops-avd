  domain_id: IDF1
  local_interface: Vlan4094
  peer_address: 10.1.253.0
  peer_link: Port-Channel47
ntp:
  local_interface:
    name: Management0
    vrf: default
  servers:
  - name: 192.168.0.1
    iburst: true
    preferred: true
  vrf: default
port_channel_interfaces:
- name: Port-Channel47
  description: MLAG_leaf-1a_Port-Channel47
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel49
  description: L2_CAMPUS_A_SPINES_Port-Channel3
  shutdown: false
  mlag: 49
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: none
