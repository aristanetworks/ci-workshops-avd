aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
config_end: true
daemon_terminattr:
  cvaddrs:
  - 192.168.0.5:9910
  cvauth:
    method: token
    token_file: /tmp/token
  cvsourceintf: Management0
  cvvrf: default
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
dns_domain: atd.lab
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1/1
  description: L2_spine-1_Ethernet4
  shutdown: false
  channel_group:
    id: 11
    mode: active
  metadata:
    peer: spine-1
    peer_interface: Ethernet4
    peer_type: l3spine
- name: Ethernet2/1
  description: L2_spine-2_Ethernet4
  shutdown: false
  channel_group:
    id: 11
    mode: active
  metadata:
    peer: spine-2
    peer_interface: Ethernet4
    peer_type: l3spine
hostname: leaf-2a
ip_domain_lookup:
  source_interfaces:
  - name: Management0
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: default
    servers:
    - ip_address: 192.168.0.1
local_users:
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$7c02c6305e03f2fc$XsDXCGgjBsRE1pPLPOuPPVNiLE2h3K2Z.eriQynDKW4PuFTs.VOhqqnLfik9yZY1c68AyUa2/UCYtKWcRp0FR/
  ssh_key: ssh-rsa 
    arista@avd-workshop-campus-1-c644c9e8-eos
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.16/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: cEOS
  fabric_name: CAMPUS_A_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_network_type
      value: campusV2
    - name: topology_hint_type
      value: Leaf
    - name: Role
      value: Leaf
    - name: Campus
      value: Cleveland
    - name: Campus-Pod
      value: Campus A
    interface_tags:
    - interface: Ethernet1/1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Uplink
    - interface: Ethernet2/1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Uplink
    - interface: Management0
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Management
ntp:
  local_interface:
    name: Management0
    vrf: default
  servers:
  - name: 192.168.0.1
    iburst: true
    preferred: true
  vrf: default
port_channel_interfaces:
- name: Port-Channel11
  description: L2_CAMPUS_A_SPINES_Port-Channel4
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: none
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: default
  ip_routing: false
